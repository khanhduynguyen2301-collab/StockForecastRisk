# StockForecastRisk — tunables, read by BOTH training and serving.
# Secrets (FINRA/EDGAR credentials) live in .env, NOT here — this file is committed.
# config.py loads this into typed Settings; nothing reads the raw YAML directly.

env: development
log_level: INFO

# --- service ---------------------------------------------------------------
app_host: "0.0.0.0"
app_port: 8000

# --- horizons --------------------------------------------------------------
# `horizon` is the default/primary horizon. `offered_horizons` is the validated
# set the API/app expose; only these calibrate (60-day excluded — see docs).
horizon: 21
offered_horizons: [5, 10, 21]

# --- risk model ------------------------------------------------------------
confidence_level: 0.95
n_paths: 1000                 # Monte Carlo paths — fan chart ONLY, never for VaR

# Per-horizon conditioning window for the filtered (vol-scaled) VaR. Single source
# of truth; filtered_historical_var.window_for_horizon mirrors it.
horizon_vol_window:
  5: 21
  10: 21
  21: 42

# Disclosed pooled breach rate per horizon (measured at the window above) + the
# crisis-year figure. Surfaced so disclosure always matches the horizon/window used.
horizon_disclosure:
  5:  {breach: "5.4%", crisis: "~7%",   window: "21"}
  10: {breach: "5.5%", crisis: "~7.5%", window: "21"}
  21: {breach: "5.8%", crisis: "~8%",   window: "42"}

# --- paths -----------------------------------------------------------------
data_sample_dir: data/sample
model_dir: models
serving_cache_path: models/serving_cache/serving_cache.parquet
forecast_model_dir: models/forecast/volatility_latest
jump_params_path: models/risk_params/jump_diffusion.parquet
prediction_log_path: logs/predictions.jsonl
