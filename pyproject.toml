[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockforecastrisk"
version = "1.0.0"
description = "Honest tail-risk and volatility engine for S&P 500 stocks — calibrated VaR/CVaR, no directional claims."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Serving dependencies (what the API and app need to read the cache and render).
# Training/pipeline extras are optional (see [project.optional-dependencies]).
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "plotly>=5.20.0",
    "streamlit>=1.35.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
# Offline pipeline only — fitting models, jump params, data ingestion.
train = [
    "xgboost>=2.0.0",
    "scikit-learn>=1.3.0",
    "yfinance>=0.2.40",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "curl_cffi>=0.6.0",
    "matplotlib>=3.8.0",
]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "isort>=5.13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["forecast_engine*", "service*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
